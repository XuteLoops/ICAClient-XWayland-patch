app-id: io.github.citrixworkspace.CitrixWorkspace
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: citrix-workspace
finish-args:
  - --share=network
  - --socket=x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --filesystem=/tmp
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.a11y.Bus
  - --talk-name=org.freedesktop.portal.Flatpak
  - --env=GDK_BACKEND=x11
  - --env=CITRIX_GDK_BACKEND=x11
  - --env=WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
  - --env=CITRIX_APPIMAGE_NO_INTEGRATE=1
modules:
  - name: citrix-workspace
    buildsystem: simple
    sources:
      - type: dir
        path: appdir
      - type: file
        path: files/citrix-workspace-wrapper.sh
      - type: file
        path: files/io.github.citrixworkspace.CitrixWorkspace.desktop
      - type: file
        path: files/copyright
    build-commands:
      - mkdir -p /app/citrix-workspace
      - cp -a . /app/citrix-workspace/
      - install -Dm755 citrix-workspace-wrapper.sh /app/bin/citrix-workspace
      - install -Dm644 io.github.citrixworkspace.CitrixWorkspace.desktop /app/share/applications/io.github.citrixworkspace.CitrixWorkspace.desktop
      - install -Dm644 citrix-workspace.png /app/share/icons/hicolor/256x256/apps/io.github.citrixworkspace.CitrixWorkspace.png
      - install -Dm644 opt/Citrix/ICAClient/desktop/Citrix-mime_types.xml /app/share/mime/packages/io.github.citrixworkspace.CitrixWorkspace.xml
      - install -Dm644 copyright /app/share/doc/citrix-workspace-app/copyright
